name: Publish to PyPI

# Trusted Publishing (OIDC). There is deliberately NO PyPI token stored in this
# repo: PyPI verifies the workflow's short-lived identity instead, so there is no
# long-lived credential to leak or rotate. One-time setup on PyPI:
#
#   PyPI → Publishing → Add a pending publisher
#     owner: volaticloud   repo: freqtrade-monte-carlo
#     workflow: publish.yml   environment: pypi
#
# Then publishing is: bump `version` in pyproject.toml, tag it, and cut a
# GitHub Release. The tag must match the version or the build job fails first.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      # The tests gate the release: never publish a build whose scores have
      # drifted from the Go implementation's golden vectors.
      - name: Test before building
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Refuse a tag that disagrees with pyproject
        if: github.event_name == 'release'
        run: |
          version="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
          echo "version $version matches tag $GITHUB_REF_NAME"

      - name: Build sdist + wheel
        run: python -m build

      - name: Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # the OIDC token Trusted Publishing exchanges; nothing else
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
